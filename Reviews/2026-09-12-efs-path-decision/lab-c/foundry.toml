# Disposable Road C lab (Store-only MUD probe). Not a protocol artifact.
# Compiler/chain runs require the coordinator's current finite slot; retained evidence is source-pinned.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fuzz = { runs = 16 }
fs_permissions = [{ access = "read", path = "./out" }]
remappings = [
  "@latticexyz/=vendor/@latticexyz/",
]
