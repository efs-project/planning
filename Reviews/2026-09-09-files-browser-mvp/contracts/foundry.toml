# Disposable local files-browser router experiment.
[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../.."]
remappings = [
  "Foundation/=../../2026-09-08-upgradeable-foundation/src/",
  "C0Core/=../../2026-09-05-c0-core/src/",
  "C0Foundation/=../../2026-09-04-mvp-c0-foundation/src/",
  "C0Admission/=../../2026-09-05-c0-admission/src/",
  "@openzeppelin/contracts/=../../2026-09-08-upgradeable-foundation/node_modules/@openzeppelin/contracts/",
]
ast = true
build_info = true
