[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
allow_paths = [".."]
remappings = ["C0Core/=../2026-09-05-c0-core/src/", "C0Admission/=../2026-09-05-c0-admission/src/", "C0Foundation/=../2026-09-04-mvp-c0-foundation/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz.runs = 128
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "../2026-09-05-mvp-build-start/type-inputs" }]
