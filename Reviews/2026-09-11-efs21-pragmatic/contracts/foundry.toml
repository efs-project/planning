[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../.."]
remappings = ["C0Core/=../../2026-09-05-c0-core/src/", "C0Admission/=../../2026-09-05-c0-admission/src/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_reports = ["NativeKernel", "NavigationIndex", "ExactTypeRegistry", "QuoteProducer", "QuoteReader"]

[profile.default.fuzz]
runs = 128
