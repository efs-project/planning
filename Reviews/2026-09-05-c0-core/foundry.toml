[profile.default]
src = "src"
test = "test"
# These two unchanged suites test the retired journal's private machinery.
# The pinned control compiles/runs them; this candidate removes that machinery.
skip = ["test/StateJournal.t.sol", "test/JournalAllocation.t.sol"]
out = "out"
libs = []
allow_paths = [".."]
remappings = ["C0Admission/=../2026-09-05-c0-admission/src/"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz.runs = 128
fs_permissions = [{ access = "read", path = "../2026-09-05-mvp-build-start/type-inputs" }]
